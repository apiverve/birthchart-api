openapi: 3.0.4
info:
  title: Birth Chart
  description: >-
    Birth Chart calculates a tropical natal chart from a birth date, time and
    location. It returns the sun, moon and rising signs, the ascendant and
    midheaven, and each planet's sign, degree and retrograde flag. Paid plans
    add the 12 house cusps, each planet's house, the major aspects and the
    element and modality balance.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/birthchart:
    get:
      summary: Birth Chart
      description: Calculate a natal chart from a birth date, time and location
      operationId: birthchart
      parameters:
        - name: date
          in: query
          schema:
            type: string
          required: true
          description: The birth date (YYYY-MM-DD or MM-DD-YYYY), between 1700 and 2200
          example: '1990-06-15'
        - name: time
          in: query
          schema:
            type: string
          required: true
          description: The local birth time in 24-hour HH:mm format
          example: '14:30'
        - name: lat
          in: query
          schema:
            type: number
          required: true
          description: The latitude of the birthplace
          example: 40.7128
        - name: lon
          in: query
          schema:
            type: number
          required: true
          description: The longitude of the birthplace (east positive)
          example: -74.006
        - name: timezone
          in: query
          schema:
            type: string
          required: false
          description: >-
            An IANA timezone name (America/New_York) or a UTC offset (+05:30).
            Looked up from the coordinates when omitted
          example: America/New_York
        - name: houseSystem
          in: query
          schema:
            type: string
          required: false
          description: The house system to use
          example: placidus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  birth:
                    localTime: 1990-06-15T14:30
                    utcTime: '1990-06-15T18:30:00Z'
                    timezone: America/New_York
                    utcOffset: '-04:00'
                    offsetSource: location
                    latitude: 40.7128
                    longitude: -74.006
                  houseSystem: placidus
                  sunSign: Gemini
                  moonSign: Pisces
                  risingSign: Libra
                  ascendant:
                    sign: Libra
                    degree: 13.7
                    longitude: 193.6954
